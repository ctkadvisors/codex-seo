name: security

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install audit tools
        run: python -m pip install bandit pip-audit
      - name: Static security scan
        run: bandit -q -r scripts hooks --severity-level medium
      - name: Dependency vulnerability scan
        run: pip-audit -r requirements.txt

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-core.txt pytest
      - run: python -m pytest tests/
      - run: python -m compileall -q scripts
      - run: bash -n install.sh uninstall.sh
      - run: |
          ! grep -RInE 'gh", "auth", "token|shell=True' scripts
          ! grep -RInE 'curl .*raw\.githubusercontent|irm https://raw\.githubusercontent' README.md docs llms.txt
